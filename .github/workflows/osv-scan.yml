name: osv-scan

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 03:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write  # To commit updated advisories.md

jobs:
  osv-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # osv-scanner only picks up SBOMs whose filename follows the spec,
      # so the CycloneDX document is written as bom.json, not sbom.json.
      - name: Generate SBOM
        run: sh tools/sbom.sh --output bom.json

      # google/osv-scanner-action v2.6.0
      - name: Run osv-scanner
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc
        with:
          scan-args: |-
            scan
            source
            -L
            bom.json
            --format=json
            --output-file=osv-results.json
        # findings are recorded in advisories.md, not a gate here
        continue-on-error: true

      # A failed scan writes no results file; without this guard it would
      # read as "no vulnerabilities found" and pass (upstream uses the same).
      - name: Check that the scan completed
        if: ${{ steps.scan.outcome == 'failure' }}
        run: |
          if [ ! -s osv-results.json ]; then
            echo "::error::osv-scanner failed without writing osv-results.json; see the scan step"
            exit 1
          fi

      - name: Update advisories.md
        run: |
          python3 - <<'PY'
          import json, datetime, sys
          data = json.load(open('osv-results.json'))
          found = [f"- **{p['package']['name']}** ({p['package'].get('version', '?')}): {v['id']} - {v.get('summary', '')[:90]}"
                   for r in data.get('results', [])
                   for p in r.get('packages', [])
                   for v in p.get('vulnerabilities', [])]
          lines = open('docs/security/advisories.md').read().split('\n')
          head, out = [], []
          for line in lines:
              if line.startswith('## Current Advisories'):
                  out = head + [line, '', *(found or ['*None at this time.*']), '',
                                f"*Last scan: {datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}.*"]
                  break
              head.append(line)
          if not out:
              sys.exit('advisories.md: ## Current Advisories section not found')
          open('docs/security/advisories.md', 'w').write('\n'.join(out) + '\n')
          print(f'advisories.md updated with {len(found)} advisories')
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet docs/security/advisories.md; then
            git add docs/security/advisories.md
            git commit -m "security: update advisories from osv-scanner scan"
            git push
          else
            echo "No changes to advisories.md"
          fi
