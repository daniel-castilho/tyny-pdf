name: osv-scan

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 03:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write  # To commit updated advisories.md

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: true

      - name: Install osv-scanner
        run: |
          curl -L -o osv-scanner.tar.gz \
            https://github.com/google/osv-scanner/releases/download/v1.8.1/osv-scanner_linux_amd64.tar.gz
          tar -xzf osv-scanner.tar.gz
          chmod +x osv-scanner

      - name: Generate SBOM
        run: sh tools/sbom.sh --output sbom.json

      - name: Run osv-scanner
        id: scan
        run: |
          ./osv-scanner scan --format=json sbom.json > osv-results.json || true
          cat osv-results.json

      - name: Update advisories.md
        run: |
          python3 -c "
import json, datetime, sys, os

with open('osv-results.json') as f:
    data = json.load(f)

advisories = []
for result in data.get('results', []):
    for pkg in result.get('packages', []):
        for vuln in pkg.get('vulnerabilities', []):
            advisories.append({
                'package': pkg.get('package', {}).get('name', 'unknown'),
                'version': pkg.get('package', {}).get('version', 'unknown'),
                'advisory': vuln.get('id', 'unknown'),
                'summary': vuln.get('summary', ''),
                'severity': 'unknown',
                'fixed_in': '',
                'detected': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')
            })
            for severity in vuln.get('severity', []):
                if severity.get('type') == 'CVSS_V3':
                    if severity.get('score', 0) >= 9.0:
                        advisories[-1]['severity'] = 'critical'
                    elif severity.get('score', 0) >= 7.0:
                        advisories[-1]['severity'] = 'high'
                    elif severity.get('score', 0) >= 4.0:
                        advisories[-1]['severity'] = 'medium'
                    else:
                        advisories[-1]['severity'] = 'low'
                    break

if os.path.exists('docs/security/advisories.md'):
    with open('docs/security/advisories.md') as f:
        content = f.read()
else:
    content = ''

# Find the '## Current Advisories' section and replace everything after it
lines = content.split('\n')
new_lines = []
in_advisories = False
for line in lines:
    if line.startswith('## Current Advisories'):
        in_advisories = True
        new_lines.append(line)
        new_lines.append('')
        continue
    if in_advisories and line.startswith('## '):
        in_advisories = False
    if not in_advisories:
        new_lines.append(line)

# Add new advisories
for adv in advisories:
    new_lines.append(f'- **{adv[\"package\"]}** ({adv[\"version\"]}): {adv[\"advisory\"]} - {adv[\"summary\"][:100]}... [{adv[\"severity\"]}] (detected {adv[\"detected\"][:10]})')

# Add timestamp
new_lines.append('')
new_lines.append(f'*Last scan: {datetime.datetime.now(datetime.timezone.utc).isoformat().replace(\"+00:00\", \"Z\")}.*')

with open('docs/security/advisories.md', 'w') as f:
    f.write('\n'.join(new_lines))

print(f'Updated advisories.md with {len(advisories)} advisories')

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet docs/security/advisories.md; then
            git add docs/security/advisories.md
            git commit -m "security: update advisories from osv-scanner scan"
            git push
          else
            echo "No changes to advisories.md"
          fi
